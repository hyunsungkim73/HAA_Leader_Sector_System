name: Update investment data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'pipeline/**'
      - '.github/workflows/update-investment-data.yml'
  pull_request:
    paths:
      - 'pipeline/**'
      - '.github/workflows/update-investment-data.yml'
  schedule:
    # 18:40 KST on weekdays = 09:40 UTC
    - cron: '40 9 * * 1-5'

permissions:
  contents: write

concurrency:
  group: investment-data-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Probe PLUS holdings HTML
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import re
          from io import StringIO
          import pandas as pd
          import requests

          for n, expected in [('006184', 200), ('006318', 150)]:
              url = f'https://www.plusetf.co.kr/product/detail?n={n}'
              text = requests.get(url, timeout=30, headers={'User-Agent': 'Mozilla/5.0'}).text
              tables = pd.read_html(StringIO(text))
              found = []
              for i, table in enumerate(tables):
                  for col in table.columns:
                      vals = []
                      for v in table[col].tolist():
                          s = str(v).strip()
                          m = re.fullmatch(r'(\d{1,6})(?:\.0+)?', s)
                          if m:
                              vals.append(m.group(1).zfill(6))
                      vals = list(dict.fromkeys(vals))
                      if len(vals) >= 10:
                          found.append((i, str(col), len(vals), vals[:12]))
              print('PLUS_HTML_PROBE', n, 'expected', expected, 'tables', len(tables), 'candidates', found)
          PY

      - name: Collect prices and HAA
        run: python pipeline/collect_market_data.py

      - name: Collect macro market
        continue-on-error: true
        run: python pipeline/collect_macro.py

      - name: Collect breadth
        continue-on-error: true
        run: python pipeline/collect_breadth.py

      - name: Check completeness
        run: python pipeline/check_completeness.py

      - name: Validate core outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          required = [
              Path('data/meta/price_coverage.csv'),
              Path('data/derived/momentum_weekly.csv'),
              Path('data/derived/relative_strength_weekly.csv'),
              Path('data/derived/tip_haa_weekly.csv'),
              Path('data/meta/completeness_report.json'),
              Path('data/meta/completeness_series.csv'),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit(f'Missing required outputs: {missing}')
          cov = pd.read_csv('data/meta/price_coverage.csv')
          print(cov.to_string(index=False))
          PY

      - name: Commit accumulated data safely
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo 'No data changes'
            exit 0
          fi
          git commit -m "data: update investment archive $(date -u +%Y-%m-%d)"
          # Rebase only the data commit onto the newest main. PR/branch validation never pushes.
          git pull --rebase origin main
          git push origin HEAD:main
