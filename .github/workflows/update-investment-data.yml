name: Update investment data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'pipeline/**'
      - 'data/raw/fundamentals/**'
      - 'data/meta/series_registry_min.json'
      - '.github/workflows/update-investment-data.yml'
  pull_request:
    paths:
      - 'pipeline/**'
      - 'data/raw/fundamentals/**'
      - 'data/meta/series_registry_min.json'
      - '.github/workflows/update-investment-data.yml'
  schedule:
    - cron: '40 9 * * 1-5'

permissions:
  contents: write

concurrency:
  group: investment-data-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Collect prices and HAA
        run: python pipeline/collect_market_data.py

      - name: Collect macro market
        continue-on-error: true
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
        run: python pipeline/collect_macro.py

      - name: Collect breadth
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python pipeline/collect_breadth_exact.py

      - name: Check completeness
        run: python pipeline/check_completeness.py

      - name: Prevent completeness regression
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          current = json.loads(Path('data/meta/completeness_report.json').read_text(encoding='utf-8'))
          try:
              base_text = subprocess.check_output(['git', 'show', 'origin/main:data/meta/completeness_report.json'], text=True)
              base = json.loads(base_text)
          except Exception as exc:
              print(f'Baseline completeness unavailable; continuing with current validation only: {exc}')
          else:
              if int(current['registered_series']) != int(base['registered_series']):
                  raise SystemExit(f"Registered series changed unexpectedly: base={base['registered_series']} current={current['registered_series']}")
              if int(current['ready_series']) < int(base['ready_series']):
                  raise SystemExit(f"Completeness regression: base ready={base['ready_series']} current ready={current['ready_series']}")
              print(f"COMPLETENESS_NON_REGRESSION_OK base={base['ready_series']} current={current['ready_series']}")
          PY

      - name: Validate core outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          required = [
              Path('data/meta/price_coverage.csv'),
              Path('data/derived/momentum_weekly.csv'),
              Path('data/derived/relative_strength_weekly.csv'),
              Path('data/derived/tip_haa_weekly.csv'),
              Path('data/meta/completeness_report.json'),
              Path('data/meta/completeness_series.csv'),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
            raise SystemExit(f'Missing required outputs: {missing}')
          cov = pd.read_csv('data/meta/price_coverage.csv')
          print(cov.to_string(index=False))
          PY

      - name: Validate Stage 2 3 4 data gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          report = json.loads(Path('data/meta/completeness_report.json').read_text(encoding='utf-8'))
          summary = {r['dataset']: r for r in report.get('dataset_summary', [])}
          fund = summary.get('Fundamental', {})
          if int(fund.get('count', 0)) != 50 or int(fund.get('sum', 0)) != 50:
              raise SystemExit(f"STAGE4_INCOMPLETE Fundamental={fund.get('sum', 0)}/{fund.get('count', 0)}; required 50/50")

          series = pd.read_csv('data/meta/completeness_series.csv').set_index('series_id')
          if 'bb350' not in series.index or not bool(series.loc['bb350', 'ready']):
              reason = series.loc['bb350', 'reason'] if 'bb350' in series.index else 'missing bb350 row'
              raise SystemExit(f"STAGE2_INCOMPLETE exact BB350 required: {reason}")
          if str(series.loc['bb350', 'quality']) != 'exact':
              raise SystemExit(f"STAGE2_INVALID_QUALITY expected exact, got {series.loc['bb350', 'quality']}")

          required_rates = ['macro_kr3y', 'macro_kr10y', 'macro_kofr', 'macro_cd91']
          bad = []
          for sid in required_rates:
              if sid not in series.index or not bool(series.loc[sid, 'ready']):
                  bad.append(f"{sid}:{series.loc[sid, 'reason'] if sid in series.index else 'missing'}")
          if bad:
              raise SystemExit('STAGE3_INCOMPLETE ' + ' | '.join(bad))

          print('DATA_GATES_COMPLETE Stage2=exact BB350 Stage3=Korean rates Stage4=Fundamental 50/50')
          PY

      - name: Commit accumulated data safely
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Main advanced during collection; skip stale data commit. A later run will regenerate from the newest main.'
            exit 0
          fi
          git add data
          if git diff --cached --quiet; then
            echo 'No data changes'
            exit 0
          fi
          git commit -m "data: update investment archive $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
