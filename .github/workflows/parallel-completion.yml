name: Parallel completion lanes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bb350:
    name: Stage 2 - BB350
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Run exact breadth collector
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python pipeline/collect_breadth_exact.py
      - name: Validate exact BB350 gate
        run: |
          python pipeline/check_completeness.py
          python - <<'PY'
          import pandas as pd
          s = pd.read_csv('data/meta/completeness_series.csv').set_index('series_id')
          if 'bb350' not in s.index:
              raise SystemExit('STAGE2_INCOMPLETE missing bb350 row')
          row = s.loc['bb350']
          ready = str(row['ready']).lower() in {'true','1'}
          if not ready or str(row['quality']) != 'exact':
              raise SystemExit(f"STAGE2_INCOMPLETE exact BB350 required: {row['reason']} quality={row['quality']}")
          print('STAGE2_COMPLETE exact BB350')
          PY

  rates:
    name: Stage 3 - Korean rates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Run macro/rates collector
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
        run: python pipeline/collect_macro.py
      - name: Validate direct Korean-rate gate
        run: |
          python pipeline/check_completeness.py
          python - <<'PY'
          import pandas as pd
          s = pd.read_csv('data/meta/completeness_series.csv').set_index('series_id')
          required = ['macro_kr3y','macro_kr10y','macro_kofr','macro_cd91']
          bad = []
          for sid in required:
              if sid not in s.index:
                  bad.append(f'{sid}:missing')
                  continue
              row = s.loc[sid]
              ready = str(row['ready']).lower() in {'true','1'}
              if not ready:
                  bad.append(f"{sid}:{row['reason']}")
          if bad:
              raise SystemExit('STAGE3_INCOMPLETE ' + ' | '.join(bad))
          print('STAGE3_COMPLETE direct Korean rates')
          PY

  fundamentals:
    name: Stage 4 - Fundamentals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Re-evaluate fundamental coverage
        run: python pipeline/check_completeness.py
      - name: Validate Fundamental 50/50 gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/meta/completeness_report.json').read_text())
          summary={r['dataset']:r for r in d.get('dataset_summary',[])}
          fund=summary.get('Fundamental',{})
          count=int(fund.get('count',0) or 0)
          ready=int(fund.get('sum',0) or 0)
          if count != 50 or ready != 50:
              raise SystemExit(f'STAGE4_INCOMPLETE Fundamental={ready}/{count}; required 50/50')
          print('STAGE4_COMPLETE Fundamental 50/50 ready')
          PY

  report:
    name: Parallel status report
    needs: [bb350, rates, fundamentals]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - name: Build exact/direct status snapshot
        run: python pipeline/parallel_status.py
      - name: Summarize lane results
        run: |
          echo '## Parallel completion lanes' >> "$GITHUB_STEP_SUMMARY"
          echo '- Stage 2 exact BB350: ${{ needs.bb350.result }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Stage 3 direct Korean rates: ${{ needs.rates.result }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Stage 4 Fundamental 50/50: ${{ needs.fundamentals.result }}' >> "$GITHUB_STEP_SUMMARY"
